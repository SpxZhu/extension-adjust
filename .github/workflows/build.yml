name: Verify Adjust extension
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: lua5.1 tests/test.lua
  native:
    # Explicit manual trigger: this uploads extension sources to build.defold.com.
    if: github.event_name == 'workflow_dispatch'
    needs: lua
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [arm64-android, arm64-ios, wasm-web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          java-version: '25'
          distribution: temurin
      - name: Download Bob 1.13.1
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bob.jar" https://github.com/defold/defold/releases/download/1.13.1/bob.jar
          echo "8f2b1381fd4d0fb92816403cd0056cb7db5ad4083615be8dcc2d868fb4939938  $RUNNER_TEMP/bob.jar" | sha256sum -c -
      - name: Compile native extension and example
        run: java -jar "$RUNNER_TEMP/bob.jar" --platform=${{ matrix.platform }} --architectures=${{ matrix.platform }} --archive --build-server=https://build.defold.com --output=build/${{ matrix.platform }} build
